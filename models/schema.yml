version: 2

sources:
  - name: raw
    database: starry-journal-476210-j1
    schema: gz_raw_data
    description: Greenweez raw data (product, ship and sales) uploaded in BigQuery.
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez. One row per product_id found in each orders_id
        
        loaded_at_field: "CAST(date_date AS TIMESTAMP)"

        freshness:
          warn_after:
            count: 90
            period: day
        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Order identifier
            tests:
              - not_null
          - name: pdt_id
            description: Product identifier sold for the line
            tests:
              - not_null
          - name: revenue
            description: Revenue for the line
          - name: quantity
            description: Quantity sold for this line
        tests:
          - unique:
              column_name: "concat(cast(orders_id as string), '-', cast(pdt_id as string))"

      - name: product
        identifier: raw_gz_product
        description: Products from Greenweez portfolio
        columns:
          - name: products_id
            description: Identifier of the product
            tests:
              - not_null
              - unique
          - name: purchse_price
            description: Purchase price of the product (raw column name contains a typo)

      - name: ship
        identifier: raw_gz_ship
        description: Shipping information for the order
        columns:
          - name: orders_id
            description: Order identifier
            tests:
              - not_null
              - unique
          - name: shipping_fee
            description: Shipping fee charged to the line of order 
          - name: shipping_fee_1
            description: Duplication of shipping_fee (compared with shipping_fee in Big Query)
          - name: logCost
            description: Logistic Costs for the line of order 
          - name: ship_cost
            description: Shipping cost for the line of order  
      - name: adwords
        identifier: raw_gz_adwords
        description: Marketing results from adwords
      - name: bing
        identifier: raw_gz_bing
        description: Marketing results from bing
      - name: criteo
        identifier: raw_gz_criteo
        description: Marketing results from criteo
      - name: facebook
        identifier: raw_gz_facebook
        description: Marketing results from facebook
models:
  - name: int_orders_margin
    description: Margin and revenue aggregated at order level
    columns:
      - name: orders_id
        description: Unique identifier of the order
        tests:
          - not_null
          - unique

      - name: date_date
        description: Date of the order
        tests:
          - not_null

      - name: revenue
        description: Total revenue for the order
        tests:
          - not_null

      - name: quantity
        description: Total quantity of products in the order
        tests:
          - not_null

      - name: purchase_cost
        description: Total purchase cost for the order
        tests:
          - not_null

      - name: margin
        description: Margin for the order
        tests:
          - not_null 
  - name: int_orders_operational
    description: Operational margin aggregated at order level
    columns:
      - name: orders_id
        description: Unique identifier of the order
        tests:
          - not_null
          - unique

      - name: date_date
        description: Date of the order
        tests:
          - not_null

      - name: operational_margin
        description: Operational margin calculated as margin + shipping fee - log cost - ship cost for the order
        tests:
          - not_null
  - name: int_sales_margin
    description: Margin calculated per product per order
    columns:
      - name: orders_id
        description: Order identifier
        tests:
          - not_null

      - name: products_id
        description: Product identifier
        tests:
          - not_null

      - name: date_date
        description: Date of the order
        tests:
          - not_null

      - name: quantity
        description: Quantity of the product sold
        tests:
          - not_null

      - name: revenue
        description: Revenue for the product line
        tests:
          - not_null

      - name: purchase_cost
        description: Purchase cost for the product line
        tests:
          - not_null

      - name: margin
        description: Margin for the product line
        tests:
          - not_null

  - name: finance_days
    description: Daily finance metrics for Greenweez (transactions, revenue, basket, costs and margins)
    columns:
      - name: date
        description: Day
        tests:
          - not_null
          - unique

      - name: total_transactions
        description: Total number of transactions (orders) per day
        tests:
          - not_null

      - name: total_revenue
        description: Total revenue per day
        tests:
          - not_null

      - name: average_basket
        description: Average basket value per day (total_revenue / total_transactions)
        tests:
          - not_null

      - name: operational_margin
        description: Total operational margin per day
        tests:
          - not_null

      - name: total_purchase_cost
        description: Total purchase cost per day
        tests:
          - not_null

      - name: total_shipping_fees
        description: Total shipping fees paid by customers per day
        tests:
          - not_null

      - name: total_log_costs
        description: Total logistics costs per day
        tests:
          - not_null

      - name: total_quantity_sold
        description: Total quantity of products sold per day
        tests:
          - not_null
  - name: int_campaigns
    description: Unified campaigns from all paid platforms
    columns:
      - name: campaign_id
        description: Campaign identifier from the source platform
        tests:
          - not_null

      - name: source
        description: Ad platform source
        tests:
          - not_null
          - accepted_values:
              values: ['adwords', 'bing', 'criteo', 'facebook']
  - name: int_campaigns_day
    description: Daily aggregated paid campaign metrics summed across all advertising platforms
    columns:
      - name: date_date
        description: Day of the advertising performance
        tests:
          - not_null
          - unique

      - name: ads_cost
        description: Total advertising cost per day across all platforms
        tests:
          - not_null

      - name: impression
        description: Total number of ad impressions per day across all platforms
        tests:
          - not_null

      - name: click
        description: Total number of ad clicks per day across all platforms
        tests:
          - not_null
  - name: finance_campaigns_day
    description: Daily finance metrics joined with daily paid campaign metrics, including ads_margin (operational_margin - ads_cost)
    columns:
      - name: date
        description: Day
        tests:
          - not_null
          - unique

      - name: ads_margin
        description: Ads margin calculated as operational_margin - ads_cost
        tests:
          - not_null

      - name: average_basket
        description: Average basket value per day (revenue / total_transactions)
        tests:
          - not_null

      - name: operational_margin
        description: Total operational margin per day
        tests:
          - not_null

      - name: ads_cost
        description: Total ad spend per day across all platforms
        tests:
          - not_null

      - name: ads_impression
        description: Total ad impressions per day across all platforms
        tests:
          - not_null

      - name: ads_clicks
        description: Total ad clicks per day across all platforms
        tests:
          - not_null

      - name: quantity
        description: Total quantity sold per day
        tests:
          - not_null

      - name: revenue
        description: Total revenue per day
        tests:
          - not_null

      - name: purchase_cost
        description: Total purchase cost per day
        tests:
          - not_null

      - name: margin
        description: Gross margin per day (revenue - purchase_cost)
        tests:
          - not_null

      - name: shipping_fee
        description: Total shipping fees per day
        tests:
          - not_null

      - name: log_cost
        description: Total logistics costs per day
        tests:
          - not_null

      - name: ship_cost
        description: Total shipping costs per day
        tests:
          - not_null